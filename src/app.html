/* ====================================================================== Rijkshuisstijl

   groen #39870C, oranje #E17000, rood #D52B1E. Lettertype: RO Sans als dat op de computer staat. */
:root{--bg:#eef2f6;--card:#fff;--ink:#1b1f24;--mute:#5d6875;--line:#d8dfe7;--brand:#154273;--brand2:#01689B;--acc:#007BC7;--green:#39870C;--red:#D52B1E;--soft:#E5F2F9;--row:#f6f9fb;--warn:#fdf3d4;--ok:#e7f2df;--err:#fbe3e0;

 background:linear-gradient(100deg,#123a66 0%,#154273 45%,#0d5f9f 80%,#007BC7 100%);box-shadow:0 6px 20px rgba(21,66,115,.18)}
